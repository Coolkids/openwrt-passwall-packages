name: Sync Upstream

on:
  schedule:
    - cron: "0 */8 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync upstream repository
    runs-on: ubuntu-latest

    steps:
      - name: Sync fork with upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo sync "${{ github.repository }}" \
            --source Openwrt-Passwall/openwrt-passwall-packages